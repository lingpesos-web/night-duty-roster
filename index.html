<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Duty Roster Manager</title>
  
  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-color: #1a365d;
      --secondary-color: #2b6cb0;
      --accent-color: #319795;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; }

    .container { max-width: 1200px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }

    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
    h1 { color: var(--primary-color); font-size: 1.5rem; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select, input, button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; outline: none; }
    button { background-color: var(--secondary-color); color: white; border: none; cursor: pointer; transition: background 0.2s; min-height: 38px; }
    button:hover { background-color: var(--primary-color); }

    .sync-status { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .status-online { background-color: #c6f6d5; color: #22543d; }
    .status-offline { background-color: #fed7d7; color: #742a2a; }

    /* Calendar Grid Layout */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 25px; }
    .day-header { text-align: center; font-weight: bold; background: var(--primary-color); color: white; padding: 8px; border-radius: 4px; font-size: 0.85rem; }
    .day-cell { border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; min-height: 90px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .day-cell.other-month { background: #f7fafc; opacity: 0.5; }
    .day-number { font-weight: bold; font-size: 0.85rem; color: #718096; }

    .assigned-person { font-weight: bold; color: var(--secondary-color); margin: 4px 0; font-size: 0.95rem; }
    .override-select { width: 100%; font-size: 0.8rem; padding: 4px; border-radius: 4px; margin-top: 4px; }

    /* Tables & Responsive Wrappers */
    .table-container { overflow-x: auto; margin-bottom: 25px; border: 1px solid var(--border-color); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; background: white; text-align: left; font-size: 0.9rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    th { background-color: var(--primary-color); color: white; font-weight: 600; }

    /* Mobile Enhancements */
    @media (max-width: 768px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      header { flex-direction: column; align-items: stretch; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls select, .controls button { width: 100%; }

      /* Mobile Grid Adjustments */
      .calendar-grid { grid-template-columns: repeat(7, minmax(45px, 1fr)); overflow-x: auto; padding-bottom: 8px; }
      .day-cell { min-height: 80px; padding: 4px; }
      .assigned-person { font-size: 0.8rem; }
      .override-select { font-size: 0.75rem; padding: 2px; }
    }

    /* Print Formatting */
    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; max-width: 100%; padding: 0; }
      .controls, .sync-status, .override-select { display: none !important; }
      .table-container { border: none; }
      table { font-size: 10pt; }
      .day-cell { min-height: 60px; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Night Duty Roster Manager</h1>
        <span id="syncStatus" class="sync-status status-offline">Connecting...</span>
      </div>
      <div class="controls">
        <label for="monthPicker">Select Month: </label>
        <input type="month" id="monthPicker">
        <button onclick="window.print()">Print Roster</button>
      </div>
    </header>

    <div id="calendarGrid" class="calendar-grid"></div>

    <h2>Monthly Shift Counts</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Helper / Filler</th>
            <th>Regular Shifts</th>
            <th>Leaves Given Away</th>
            <th>Cover Shifts Picked Up</th>
            <th>Total Net Shifts</th>
          </tr>
        </thead>
        <tbody id="countsTableBody"></tbody>
      </table>
    </div>

    <h2>Fairness Balance Ledger</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Helper Name</th>
            <th>Cumulative Target</th>
            <th>Actual Worked</th>
            <th>Fairness Balance Variance</th>
          </tr>
        </thead>
        <tbody id="fairnessTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDkk8w01GD2mJg-KPzSxe15V9eCSPcigw8",
      authDomain: "night-duty-roster-d4fd1.firebaseapp.com",
      databaseURL: "https://night-duty-roster-d4fd1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "night-duty-roster-d4fd1",
      storageBucket: "night-duty-roster-d4fd1.firebasestorage.app",
      messagingSenderId: "869781250238",
      appId: "1:869781250238:web:47c8829f75c9b0c4d83eef",
      measurementId: "G-M0HCTP5QB9"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const helpers = ["Gina", "Joy", "Roena", "Roselle"];
    const allAssignees = ["Gina", "Joy", "Roena", "Roselle", "Nurse Tong"];

    let currentYearMonth = new Date().toISOString().slice(0, 7);
    let overrides = {};

    const monthPicker = document.getElementById('monthPicker');
    const syncStatus = document.getElementById('syncStatus');
    monthPicker.value = currentYearMonth;

    // Listen for Cloud Database Changes
    db.ref("roster_overrides").on("value", (snapshot) => {
      overrides = snapshot.val() || {};
      syncStatus.textContent = "Live Cloud Synced";
      syncStatus.className = "sync-status status-online";
      renderRoster();
    }, (error) => {
      console.error("Sync Error:", error);
      syncStatus.textContent = "Offline Mode";
      syncStatus.className = "sync-status status-offline";
    });

    monthPicker.addEventListener('change', (e) => {
      currentYearMonth = e.target.value;
      renderRoster();
    });

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function handleOverrideChange(dateKey, value) {
      if (value === "DEFAULT") {
        db.ref("roster_overrides/" + dateKey).remove();
      } else {
        db.ref("roster_overrides/" + dateKey).set(value);
      }
    }

    function renderRoster() {
      const [yearStr, monthStr] = currentYearMonth.split("-");
      const year = parseInt(yearStr, 10);
      const month = parseInt(monthStr, 10) - 1;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = getDaysInMonth(year, month);

      const calendarGrid = document.getElementById('calendarGrid');
      calendarGrid.innerHTML = '';

      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      dayNames.forEach(name => {
        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = name;
        calendarGrid.appendChild(header);
      });

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell other-month';
        calendarGrid.appendChild(emptyCell);
      }

      let monthlyCounts = {};
      allAssignees.forEach(a => monthlyCounts[a] = { regular: 0, leaves: 0, covers: 0, total: 0 });

      for (let day = 1; day <= totalDays; day++) {
        const dateKey = `${currentYearMonth}-${String(day).padStart(2, '0')}`;
        const defaultPerson = helpers[(day - 1) % helpers.length];
        const actualPerson = overrides[dateKey] || defaultPerson;

        // Tallying Logic
        if (overrides[dateKey]) {
          monthlyCounts[defaultPerson].leaves++;
          monthlyCounts[actualPerson].covers++;
        } else {
          monthlyCounts[defaultPerson].regular++;
        }
        monthlyCounts[actualPerson].total++;

        // Render Day Cell
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        let selectOptions = `<option value="DEFAULT" ${!overrides[dateKey] ? 'selected' : ''}>Auto (${defaultPerson})</option>`;
        allAssignees.forEach(p => {
          selectOptions += `<option value="${p}" ${overrides[dateKey] === p ? 'selected' : ''}>${p}</option>`;
        });

        cell.innerHTML = `
          <div class="day-number">${day}</div>
          <div class="assigned-person">${actualPerson}</div>
          <select class="override-select" onchange="handleOverrideChange('${dateKey}', this.value)">
            ${selectOptions}
          </select>
        `;
        calendarGrid.appendChild(cell);
      }

      renderCountsTable(monthlyCounts);
      renderFairnessTable(monthlyCounts, totalDays);
    }

    function renderCountsTable(counts) {
      const tbody = document.getElementById('countsTableBody');
      tbody.innerHTML = '';
      allAssignees.forEach(person => {
        const data = counts[person];
        const row = `<tr>
          <td><strong>${person}</strong></td>
          <td>${data.regular}</td>
          <td>${data.leaves}</td>
          <td>${data.covers}</td>
          <td><strong>${data.total}</strong></td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function renderFairnessTable(counts, totalDays) {
      const tbody = document.getElementById('fairnessTableBody');
      tbody.innerHTML = '';
      const targetPerHelper = (totalDays / helpers.length).toFixed(1);

      helpers.forEach(person => {
        const actual = counts[person].total;
        const variance = (actual - targetPerHelper).toFixed(1);
        const varianceDisplay = variance > 0 ? `+${variance}` : variance;

        const row = `<tr>
          <td><strong>${person}</strong></td>
          <td>${targetPerHelper}</td>
          <td>${actual}</td>
          <td><strong style="color: ${variance < 0 ? '#e53e3e' : '#2b6cb0'};">${varianceDisplay}</strong></td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }
  </script>
</body>
</html>
