<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Duty Roster Manager</title>
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f9;
    }
    h1, h2 {
      color: #333;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button, select {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      background-color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .day-header {
      font-weight: bold;
      text-align: center;
      background-color: #e2e8f0;
      padding: 8px;
      border-radius: 4px;
    }
    .day-cell {
      border: 1px solid #cbd5e0;
      min-height: 80px;
      padding: 5px;
      border-radius: 4px;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .day-number {
      font-weight: bold;
      font-size: 12px;
      color: #4a5568;
    }
    .person-tag {
      font-weight: bold;
      padding: 4px;
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
      margin: 2px 0;
    }
    /* Original Helper Colors */
    .bg-Gina { background-color: #fed7d7; color: #9b2c2c; }
    .bg-Joy { background-color: #feebc8; color: #9c4221; }
    .bg-Roena { background-color: #c6f6d5; color: #22543d; }
    .bg-Roselle { background-color: #e9d8fd; color: #553c9a; }
    .bg-NurseTong { background-color: #bee3f8; color: #2b6cb0; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #edf2f7;
    }
    
    @media print {
      .controls, .override-select { display: none !important; }
      body { background: white; margin: 0; }
      .calendar, table { box-shadow: none; }
    }
  </style>
</head>
<body>

  <h1>Night Duty Roster Manager</h1>

  <div class="controls">
    <button onclick="changeMonth(-1)">Previous Month</button>
    <strong id="monthDisplay" style="font-size: 18px;"></strong>
    <button onclick="changeMonth(1)">Next Month</button>
    <button onclick="window.print()" style="margin-left: auto;">Print Roster</button>
  </div>

  <div class="calendar" id="calendar"></div>

  <h2>Monthly Shift Counts</h2>
  <table>
    <thead>
      <tr>
        <th>Helper</th>
        <th>Regular Shifts</th>
        <th>Leaves Given Away</th>
        <th>Cover Shifts Picked Up</th>
        <th>Total Net Shifts</th>
      </tr>
    </thead>
    <tbody id="countsTable"></tbody>
  </table>

  <h2>Fairness Balance Ledger</h2>
  <table>
    <thead>
      <tr>
        <th>Helper Name</th>
        <th>Cumulative Target</th>
        <th>Actual Worked</th>
        <th>Fairness Balance Variance</th>
      </tr>
    </thead>
    <tbody id="fairnessTable"></tbody>
  </table>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDkk8w01GD2mJg-KPzSxe15V9eCSPcigw8",
      authDomain: "night-duty-roster-d4fd1.firebaseapp.com",
      databaseURL: "https://night-duty-roster-d4fd1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "night-duty-roster-d4fd1",
      storageBucket: "night-duty-roster-d4fd1.firebasestorage.app",
      messagingSenderId: "869781250238",
      appId: "1:869781250238:web:47c8829f75c9b0c4d83eef",
      measurementId: "G-M0HCTP5QB9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const helpers = ["Gina", "Joy", "Roena", "Roselle"];
    const allPeople = ["Gina", "Joy", "Roena", "Roselle", "Nurse Tong"];

    let currentDate = new Date();
    let overrides = {};

    // Live Sync with Firebase
    db.ref("roster_overrides").on("value", (snapshot) => {
      overrides = snapshot.val() || {};
      render();
    });

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      render();
    }

    function getClass(name) {
      return 'bg-' + name.replace(/\s+/g, '');
    }

    function setOverride(dateKey, value) {
      if (value === "DEFAULT") {
        db.ref("roster_overrides/" + dateKey).remove();
      } else {
        db.ref("roster_overrides/" + dateKey).set(value);
      }
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('monthDisplay').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const calendarEl = document.getElementById('calendar');
      calendarEl.innerHTML = '';

      const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      daysOfWeek.forEach(d => {
        calendarEl.innerHTML += `<div class="day-header">${d}</div>`;
      });

      for (let i = 0; i < firstDay; i++) {
        calendarEl.innerHTML += `<div></div>`;
      }

      let counts = {};
      allPeople.forEach(p => counts[p] = { regular: 0, leaves: 0, covers: 0, total: 0 });

      for (let day = 1; day <= totalDays; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        // Original rotation sequence logic
        const defaultPerson = helpers[(day - 1) % helpers.length];
        const assignedPerson = overrides[dateKey] || defaultPerson;

        if (overrides[dateKey]) {
          counts[defaultPerson].leaves++;
          counts[assignedPerson].covers++;
        } else {
          counts[defaultPerson].regular++;
        }
        counts[assignedPerson].total++;

        let selectOptions = `<option value="DEFAULT" ${!overrides[dateKey] ? 'selected' : ''}>Auto (${defaultPerson})</option>`;
        allPeople.forEach(p => {
          selectOptions += `<option value="${p}" ${overrides[dateKey] === p ? 'selected' : ''}>${p}</option>`;
        });

        calendarEl.innerHTML += `
          <div class="day-cell">
            <div class="day-number">${day}</div>
            <div class="person-tag ${getClass(assignedPerson)}">${assignedPerson}</div>
            <select class="override-select" onchange="setOverride('${dateKey}', this.value)">
              ${selectOptions}
            </select>
          </div>
        `;
      }

      // Render Shift Table
      const countsTbody = document.getElementById('countsTable');
      countsTbody.innerHTML = '';
      allPeople.forEach(p => {
        countsTbody.innerHTML += `
          <tr>
            <td><strong>${p}</strong></td>
            <td>${counts[p].regular}</td>
            <td>${counts[p].leaves}</td>
            <td>${counts[p].covers}</td>
            <td><strong>${counts[p].total}</strong></td>
          </tr>
        `;
      });

      // Render Fairness Table
      const fairnessTbody = document.getElementById('fairnessTable');
      fairnessTbody.innerHTML = '';
      const target = Math.round(totalDays / helpers.length);

      helpers.forEach(p => {
        const actual = counts[p].total;
        const variance = actual - target;
        const varText = variance > 0 ? `+${variance}` : `${variance}`;
        fairnessTbody.innerHTML += `
          <tr>
            <td><strong>${p}</strong></td>
            <td>${target}</td>
            <td>${actual}</td>
            <td><strong>${varText}</strong></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
